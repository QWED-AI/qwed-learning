name: 📚 Course Drift Check

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: this workflow only reads the repo and reaches PyPI/GitHub APIs.
permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      # Pinned to immutable SHAs (actions/checkout@v3, actions/setup-python@v4).
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c
        with:
          python-version: '3.10'

      - name: Install course packages
        # Exact pins (bumped together with the course pins they verify — the
        # pins gate fails when these go stale). Integration extras are needed
        # because import resolution must cover the framework lessons too.
        run: pip install "qwed[langchain,llamaindex,crewai]==7.2.0" qwed-a2a==0.3.0 qwed-infra==0.3.0

      - name: Check course-vs-code drift
        run: python scripts/check_course_drift.py
