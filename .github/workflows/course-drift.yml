name: 📚 Course Drift Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install latest course packages
        run: pip install qwed qwed-a2a qwed-infra

      - name: Check course-vs-code drift
        run: python scripts/check_course_drift.py
